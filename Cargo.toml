[workspace]
# commenting for now due to unused warning.
# name = "isosceles-games"
members = ["custom-plugins-bevy", "isosceles-cli", "isosceles-desktop-system", "v-26-2026", "isosceles-desktop-ui", "isosceles-core"]
resolver = "3"

[workspace.dependencies]
# this uses a local instance of the bevy latest builds.
# ensure local instance upto date. (this might later get replaced by solid LTS version)
bevy = { version = "0.19.0", default-features = false }
ratatui = "0.30.2"
color-eyre = "0.6.5"
ratatui-textarea = "0.9.2"
leptos = { version = "0.8"}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1"}
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
tauri = { version = "2"}
tauri-plugin-opener = "2"
serde_json = "1"
tauri-plugin-log = "2"
log = "0.4"

# Custom plugin is a lib-like custom plugin.
custom-plugins-bevy = {path = "custom-plugins-bevy"}
ripgrep = "15.2.0"
isosceles-core = {path = "isosceles-core"}