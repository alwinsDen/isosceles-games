[workspace]
# commenting for now due to unused warning.
# name = "isosceles-games"
members = ["custom_plugins_bevy", "isosceles-cli", "v-26-2026"]
resolver = "3"

[workspace.dependencies]
# this uses a local instance of the bevy latest builds.
# ensure local instance upto date. (this might later get replaced by solid LTS version)
bevy = { path = "../bevy", default-features = false }
ratatui = "0.30.2"
color-eyre = "0.6.5"
ratatui-textarea = "0.9.2"

# Custom plugin is a lib-like custom plugin.
custom_plugins_bevy = {path = "custom_plugins_bevy"}
ripgrep = "15.2.0"